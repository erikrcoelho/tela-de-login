<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section id="login"> 
            <div id="imagem">
               
            </div>
            <div id="form">
                
                <h1>Login</h1>
                <p>Seja bem vindo novamente. Faça login para continuar.</p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <span class="material-symbols-outlined">
                        person
                        </span>
                        <input type="email" name="login" id="ilogin" placeholder="Insira seu email" required maxlength="30">
                        <label for="ilogin"></label>
                    </div><br>
                    <div class="campo">
                        <span class="material-symbols-outlined">
                        key
                        </span>
                        <input type="password" name="senha" id="isenha" placeholder="Insira sua senha" required minlength="8" maxlength="15">
                        <label for="isenha"></label>
                    </div>
                    
                        <input type="submit" value="Login">
                        <a href="esqueci.html">Esqueci a senha <span class="material-symbols-outlined">mail</span></a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
